<!DOCTYPE html>
<html lang="en">
<head> 
	<meta charset="UTF-8"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
	<title>Weather App</title> 
	<link rel="stylesheet" href="style.css">
</head>
<body> 
<div class="app"> 
	<h1 id="title">☀️ Weather App</h1> 
	
    <form id="searchForm"> 
	    <input id="cityInput" placeholder="Enter city name (e.g. Surat)"> 
	    <button type="submit" id="sub">Search</button> 
	</form> 
	
    <p id="status"></p> 
	<div id="result"></div> 

    <div id="recentSearches">
        <h3 id="lastsearch">Recent Searches</h3>
        <ul id="searchList"></ul>
    </div>
    <div class="resetbtn">
		<button type="reset" id="rst">Reset</button>
	</div>
</div>
 
<script src="script.js"></script>
</body>
</html>
